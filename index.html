<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .grid-area {
            display: grid;
            grid-template-rows: 12vh 7vh 73vh 5vh;

            gap: 5px;

            grid-template-areas:
                "header header header header"
                "nav nav nav nav"
                "sidebar contenido contenido contenido"
                "footer footer footer footer";
        }
        .nav{
            grid-area: nav;
            background: #b5bec5;
        }
        .nav a{
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }


        .header {
            grid-area: header;
            background: #66cc8d;
        }

        .sidebar {
            grid-area: sidebar;
            background: #1f6654;
            padding: 0;
            display: flex;
            flex-direction: column;
        }
        .sidebar div a{
            display: block;
            color: white;
            text-decoration: none;
            margin: 10px 20px;
        }

        .contenido {
            grid-area: contenido;
            background: #e0e2e2;
        }

        .footer {
            grid-area: footer;
            background: #66cc8d;
        }

        .footer a{
            color: white;
            text-decoration: none;
        }

        .area-item {
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border-radius: 8px;
        }

        header{
            display: flex;
        }

        header img {
            width: 50px;
            height: 50px;
            margin-right: 10px;
        }
        @media (max-width: 576px) {
            .grid-area {
                display: grid;
                grid-template-rows: 12vh 7vh 8vh 65vh 5vh;

                gap: 5px;

                grid-template-areas:
                    "header header header header"
                    "nav nav nav nav"
                    "sidebar sidebar sidebar sidebar"
                    "contenido contenido contenido contenido"
                    "footer footer footer footer";
            }

            .sidebar div a{
                display: flex;
                color: white;
                text-decoration: none;
                margin: 0px 5px;
            }
            .sidebar div{
                display: flex;
            }
            h1{
                font-size: 1.2rem;
            }
            .header{
                display: flex;
                flex-direction: column;
                align-items: center;
            }
        }



    </style>
</head>
<body>

    <div class="grid-area">

        <header class="area-item header">
            <img src="https://carrerasuniversitarias.com.co/logos/original/logo-universidad-industrial-de-santander.webp" alt="logo uis">
            <h1>UNIVERSIDAD INDUSTRIAL DE SANTANDER</h1>
        </header>

        <div class="area-item nav">
            <nav class="navbar navbar-dark bg-secondary">
                <div class="container justify-content-space-arround">
                    <a class="nav-link text-white"
                        href="./pages/formulario.html"
                        target="frame"
                        title="Ir al inicio">
                        Formulario HTML 5
                    </a>
                    <a class="nav-link text-white"
                        href="https://es.wikipedia.org/wiki/Animales_dom%C3%A9sticos"
                        title="Ver audios"
                        target="frame">
                        Wikipedia
                    </a>
                    <a class="nav-link text-white"
                        href="./pages/foto.html"
                        title="Ver videos"
                        target="frame">
                        Una fotografia
                    </a>
                </div>
            </nav>
        </div>


        <div class="area-item sidebar">
            <div>
                <a href="./pages/cuento.html" target="frame">Cuento</a>
                <a href="./pages/arcoiris.html" target="frame">Arcoiris</a>
                <a href="./pages/carrusel.html" target="frame">Mosaico</a>
                <a href="./pages/videos.html" target="frame">Multimedia</a>
                <a href="./pages/que_mascota.html" target="frame">mascota!</a>
                <a href="./pages/IA.html" target="frame">IA</a>
            </div>
        </div>

        <div class="area-item contenido">
            <iframe
                name="frame"
                width="100%"
                height="100%"
                style="border: 1px solid black;">
            </iframe>
        </div>

        <div class="area-item footer">
            <a href="./pages/footer.html" target="frame">integrantes</a>
        </div>

    </div>
</body>
</html>
