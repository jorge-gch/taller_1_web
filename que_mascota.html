<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>que mascota eres</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!--que mascota eres-->
    <div class="container text-center mt-4">

        <h2>🐾 ¿Qué mascota eres?</h2>

        <select id="mascota" class="form-select w-50 mx-auto">
            <option value="">Selecciona una mascota</option>
            <option value="perro">🐶 Perro</option>
            <option value="gato">🐱 Gato</option>
            <option value="conejo">🐰 Conejo</option>
            <option value="hamster">🐹 Hámster</option>
        </select>

        <button class="btn btn-primary mt-3" onclick="mostrarResultado()">
            Descubrir
        </button>

        <div id="resultado" class="alert alert-info mt-3 w-50 mx-auto">
            Aquí aparecerá el resultado.
        </div>

    </div>
    <script>
    function mostrarResultado() {

        let mascota = document.getElementById("mascota").value;
        let resultado = document.getElementById("resultado");

        if (mascota === "perro") {
            resultado.innerHTML = "🐶 Eres una persona activa y sociable.";
        }
        else if (mascota === "gato") {
            resultado.innerHTML = "🐱 Eres una persona independiente y tranquila.";
        }
        else if (mascota === "conejo") {
            resultado.innerHTML = "🐰 Eres una persona tranquila y cariñosa.";
        }
        else if (mascota === "hamster") {
            resultado.innerHTML = "🐹 Eres una persona curiosa y divertida.";
        }
        else {
            resultado.innerHTML = "Selecciona una mascota.";
        }
    }
    </script>
</body>
</html>
