<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carrusel Bootstrap</title>


    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div id="carruselAnimales" 
        class="carousel slide" 
        data-bs-ride="carousel"
        data-bs-interval="2500"
        style="display: flex; justify-content: center; align-items: center; height: 100vh;">

        <!-- Indicadores -->
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carruselAnimales" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#carruselAnimales" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#carruselAnimales" data-bs-slide-to="2"></button>
            <button type="button" data-bs-target="#carruselAnimales" data-bs-slide-to="3"></button>
        </div>

        <!-- Tarjetas -->
        <div class="carousel-inner">

            <!-- Perro -->
            <div class="carousel-item active">
                <div class="card mx-auto" style="width: 20rem;">
                    <img src="https://cdn.pixabay.com/photo/2016/02/18/18/37/puppy-1207816_1280.jpg" class="card-img-top" alt="Perro" style="height: 300px; object-fit: cover;">
                    <div class="card-body text-center">
                        <h5 class="card-title">Perro</h5>
                        <p class="card-text">El perro es uno de los animales domésticos más comunes.</p>
                    </div>
                </div>
            </div>

            <!-- Gato -->
            <div class="carousel-item">
                <div class="card mx-auto" style="width: 20rem;">
                    <img src="https://media.istockphoto.com/id/1443562748/es/foto/lindo-gato-de-jengibre.jpg?s=612x612&w=0&k=20&c=JVC5Z3LxpaTQaXu_fMZjIb73r39z6b0SnAxvNI8iZG0=" class="card-img-top" alt="Gato" style="height: 300px; object-fit: cover;">
                    <div class="card-body text-center">
                        <h5 class="card-title">Gato</h5>
                        <p class="card-text">El gato es un animal doméstico independiente y cariñoso.</p>
                    </div>
                </div>
            </div>

            <!-- Conejo -->
            <div class="carousel-item">
                <div class="card mx-auto" style="width: 20rem; ">
                    <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/3/37/Oryctolagus_cuniculus_Tasmania_2.jpg/960px-Oryctolagus_cuniculus_Tasmania_2.jpg?utm_source=es.wikipedia.org&utm_campaign=index&utm_content=thumbnail" class="card-img-top" alt="Conejo" style="height: 300px; object-fit: cover;">
                    <div class="card-body text-center">
                        <h5 class="card-title">Conejo</h5>
                        <p class="card-text">El conejo es un pequeño animal doméstico y tranquilo.</p>
                    </div>
                </div>
            </div>

            <!-- Hámster -->
            <div class="carousel-item">
                <div class="card mx-auto" style="width: 20rem;">
                    <img src="https://media.istockphoto.com/id/675804830/es/foto/h%C3%A1mster-beige.jpg?s=612x612&w=0&k=20&c=RG2fLgdnX9D6P4n-7SzshM2PHF8B05vTHKoO4WlB28g=" class="card-img-top" alt="Hámster" style="height: 300px; object-fit: cover;">
                    <div class="card-body text-center">
                        <h5 class="card-title">Hámster</h5>
                        <p class="card-text">El hámster es una mascota pequeña y fácil de cuidar.</p>
                    </div>
                </div>
            </div>

        </div>

        <!-- Botón anterior -->
        <button class="carousel-control-prev" 
                type="button" 
                data-bs-target="#carruselAnimales" 
                data-bs-slide="prev"
                style="background-color: black; width: 50px; height: 50px; top: 50%; margin-top: -25px; border-radius: 50%;">
            <span class="carousel-control-prev-icon"></span>
        </button>

        <!-- Botón siguiente -->
        <button class="carousel-control-next" 
                type="button" 
                data-bs-target="#carruselAnimales" 
                data-bs-slide="next"
                style="background-color: black; width: 50px; height: 50px; top: 50%; margin-top: -25px; border-radius: 50%;">
            <span class="carousel-control-next-icon"></span>
        </button>

    </div>

    <!-- JavaScript de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
