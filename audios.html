<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audios</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
</head>
<body>
    <!-- AUDIOS -->
    <section id="audios" class="container p-4">

        <h2>Canciones</h2>

        <div class="grid-audios">

            <div class="card p-3 text-center">
                <h3>Duvet</h3>
                <audio controls>
                    <source src="./audios/Bôa - Duvet.mp3" type="audio/mpeg">
                </audio>
            </div>

            <div class="card p-3 text-center">
                <h3>Lovers Rock</h3>
                <audio controls>
                    <source src="./audios/Lovers Rock.mp3" type="audio/mpeg">
                </audio>
            </div>

            <div class="card p-3 text-center">
                <h3>I Wanna Be Yours</h3>
                <audio controls>
                    <source src="./audios/I Wanna Be Yours.mp3" type="audio/mpeg">
                </audio>
            </div>

            <div class="card p-3 text-center">
                <h3>Viva La Vida</h3>
                <audio controls>
                    <source src="./audios/Coldplay - Viva La Vida (Official Video).mp3" type="audio/mpeg">
                </audio>
            </div>

        </div>

    </section>
</body>
</html>
